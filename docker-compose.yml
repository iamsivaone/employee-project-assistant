version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: employee-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_db_local

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10


  chromadb:
    image: chromadb/chroma:latest
    container_name: employee-chromadb
    restart: unless-stopped

    ports:
      - "8002:8000"

    volumes:
      - chroma_data:/chroma/chroma


  api:
    build: .

    container_name: employee-api

    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

    env_file:
      - .env.docker

    command: >
      sh -c "
      uv run python -m app.database.seed &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

    ports:
      - "8001:8000"

    volumes:
      - .:/app


  streamlit:
    build: .

    container_name: employee-streamlit

    depends_on:
      - api

    env_file:
      - .env.docker

    command: >
      uv run streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8502:8501"

    volumes:
      - .:/app


volumes:
  postgres_data:
  chroma_data: